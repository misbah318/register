!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            background-color: 
            
            
            rgb(238, 223, 235);
            width: 350px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        button[type="submit"] {
            background-color: green;
        }

        button[type="reset"] {
            background-color: red;
        }

        p {
            text-align: center;
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Registration Form</h1>

    <form>

        <label>Name:</label>
        <input type="text">

        <label>Email:</label>
        <input type="email">

        <label>Password:</label>
        <input type="password">

        <label>Gender:</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br><br>

        <label>Course:</label>
        <select>
            <option>BCA</option>
            <option>B.Tech</option>
            <option>B.Sc</option>
        </select>

        <label for="start">Date of Birth:</label>
        <input type="date" id="start" name="begin"
               min="1997-01-01" max="2030-12-31">

        <label>Address:</label>
        <textarea rows="4"></textarea>

        <input type="checkbox"> I agree to terms
        <br><br>

        <button type="submit">Register</button>
        <button type="reset">Reset</button>

    </form>

    <hr>

    <p>Thank You!</p> 

</body>
</html>
